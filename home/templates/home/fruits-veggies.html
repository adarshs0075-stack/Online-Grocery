    <div id="paymentModal" class="modal-overlay">
        <div class="modal-card"> 

            <h3>Payment Gateway (Demo)</h3>
            <p class="amount-text">Total Amount: <strong>₹<span id="payAmount">499</span></strong></p>
            <div class="input-group">
                <label for="payMethod">Choose Payment Method:</label>
                <select id="payMethod">
                    <option value="upi">UPI (GPay / PhonePe / Paytm)</option>
                    <option value="card">Credit / Debit Card</option>
                    <option value="cod">Cash on Delivery</option>
                </select>
            </div>
            <button class="pay-btn" onclick="processPayment()">Pay Now</button>
            <button class="cancel-btn" onclick="closePaymentModal()">Cancel</button>
        </div>
    </div>
    <div class="cart-icon-wrapper" onclick="toggleCartDrawer()">
        <span class="cart-icon">🛒</span>
        <span id="cartCount" class="cart-badge">0</span>
    </div>
    <div id="cartOverlay" class="cart-overlay" onclick="toggleCartDrawer()"></div>

    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h2>Your Shopping Cart</h2>
            <button class="close-btn" onclick="toggleCartDrawer()">&times;</button>
        </div>

        <div id="cartItemsList" class="cart-body">
            <p class="empty-msg">Your cart is empty.</p>
        </div>

        <div class="cart-footer">
            <div class="total-price-box">

            </div>
            <button class="checkout-btn" onclick="openPaymentModal(totalPrice)">Proceed to Pay Total Amount</button>
